function splitSents(text) {
  const MARK = "\u0001";

    .replace(/(?=又因为|再根据|同理|来求得|(?<!乘上?)乙完成|-[角A-Za-z])/g, MARK)

        const c = near([...p.matchAll(/(?<=[，,])(?=那么|所以|则|即|得到|可得|我们)/g)]);

        k = c.length ? c[0] : any.length ? any[0] : -1;

function sentStarts(words, sents) {
  const wOff = []; let c = 0, off = 0; words.forEach(x => { wOff.push(c); c += x[1].length; });

function fixLineCuts(txt, cuts) {

// ---------- 学习界面 ----------
async function openChapter(course, ch, startQid) {
  const manifest = await (await fetch(CONTENT + ch.dir + "/manifest.json", { cache: "no-cache" })).json();
  cur = { course, chapter: ch, manifest, qi: 0 };
  await loadCuts(ch.dir);   // 管理员手动改过的分句
  if (startQid) { const i = manifest.questions.findIndex(q => q.id === startQid); if (i >= 0) cur.qi = i; }
  else { const i = manifest.questions.findIndex(q => !status[qidOf(ch.dir, q)]); cur.qi = i < 0 ? 0 : i; }   // 默认进到第一道还没提交的题
  show("viewLearn");
  $("learnTitle").textContent = MODE_NAME[course.mode] + " · " + course.grade + course.term + " · " + (course.term === "专题" ? "" : "第" + ch.num + "章 ") + ch.title;
  loadQuestion(cur.qi);
}
$("backBtn").onclick = () => { stopMedia(); enterCourse(); };
function unlocked() { return true; }   // 每个单元的所有题目直接解锁，不用先交上一题
function renderPills() {
  const box = $("pills"); box.innerHTML = "";
  cur.manifest.questions.forEach((q, i) => {

let mediaEls = [];

function loadQuestion(i) {
  stopMedia();

// ---------- 录音 + 提交给老师批改（两种版本共用）----------
let micStream = null;
async function getMic() { return micStream ??= await navigator.mediaDevices.getUserMedia({ audio: true }); }
function blobToBase64(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onloadend = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); }); }
// 录音 -> 回听 -> 重录/提交；setEnabled 用来在看完视频之前锁住录音
function makeSubmitter(qid, onSubmitted) {
  const el = document.createElement("div"); el.className = "recbar";
  const main = document.createElement("button"), st = document.createElement("div"), review = document.createElement("div");
  st.className = "status"; el.append(main, st, review);
  let enabled = true, lockText = "", mr, chunks = [], recording = false, blob = null;
  let _onRecStart = null, _onRecEnd = null;
  const sent = () => status[qid] && status[qid].status !== "retry";   // 交过且老师没让重录 → 锁定
  const idle = () => {
    main.textContent = sent() ? (status[qid].status === "pass" ? "☑️ 老师已通过" : "⏳ 已提交，等待老师批改") : enabled ? (status[qid] ? "🎙 重新录一遍" : "🎙 开始复述") : lockText;
    main.disabled = sent() || !enabled; main.className = "main btn-green";
  };
  idle();
  main.onclick = async () => {
    if (!recording) {
      let stream; try { stream = await getMic(); } catch (e) { st.textContent = "⚠ 无法使用麦克风，请允许浏览器使用麦克风后重试"; return; }
      mr = new MediaRecorder(stream); chunks = []; review.innerHTML = "";
      mr.ondataavailable = e => chunks.push(e.data); mr.onstop = onStop;
      mr.start(); recording = true; main.textContent = "■ 说完了，点这里停止"; main.className = "main btn-red"; st.textContent = "录音中…";
      if (_onRecStart) _onRecStart();
    } else { mr.stop(); recording = false; idle(); if (_onRecEnd) _onRecEnd(); }
  };
  function onStop() {
    blob = new Blob(chunks, { type: "audio/webm" });
    st.textContent = "先听一下自己的录音，满意就提交给老师";
    review.innerHTML = "";
    const a = document.createElement("audio"); a.controls = true; a.src = URL.createObjectURL(blob);
    const acts = document.createElement("div"); acts.className = "acts";
    const redo = document.createElement("button"); redo.textContent = "🔄 重录";
    const sub = document.createElement("button"); sub.className = "btn-blue"; sub.textContent = "📤 提交给老师批改";
    redo.onclick = () => { review.innerHTML = ""; st.textContent = ""; };
    sub.onclick = async () => {
      sub.disabled = redo.disabled = true; st.textContent = "正在提交…";
      try {
        const r = await sbPost("visual_recordings", [{ referral_code: user.referrer, student_no: user.studentNo, question_id: qid, audio_base64: await blobToBase64(blob) }]);
        if (!r.ok) throw new Error("HTTP " + r.status);
        status[qid] = { status: "pending", feedback: null, created_at: new Date().toISOString() };
        review.innerHTML = ""; st.innerHTML = "✅ 已提交，<b>等待老师批改</b>。可以继续下一题。";
        idle(); onSubmitted();
      } catch (e) { st.textContent = "⚠ 提交失败：" + e.message + "，录音还在，请再点一次提交"; sub.disabled = redo.disabled = false; }
    };
    acts.append(redo, sub); review.append(a, acts);
  }
  return { el, setEnabled(on, text) { enabled = on; lockText = text || ""; if (!recording && !review.children.length) idle(); }, setRecordCallbacks(onStart, onEnd) { _onRecStart = onStart; _onRecEnd = onEnd; } };
}

let pinyinFn = null, asrPipe = null;
const HAS_WEBGPU = !!navigator.gpu;
async function getPinyin() { return pinyinFn ??= (await import("https://cdn.jsdelivr.net/npm/pinyin-pro@3/+esm")).pinyin; }
async function getAsr() {
  if (asrPipe) return asrPipe;
  const { pipeline } = HAS_WEBGPU ? await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0")
    : await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js");
  return asrPipe = HAS_WEBGPU ? await pipeline("automatic-speech-recognition", "onnx-community/whisper-small", { device: "webgpu" })
    : await pipeline("automatic-speech-recognition", "Xenova/whisper-small", { quantized: true });
}
// 按拼音(不管声调)比对，同音字不算错；"角B"这类单个英文字母按字母名读音比
const LETTER_PINYIN = { A:"ei",B:"bi",C:"xi",D:"di",E:"yi",F:"aifu",G:"ji",H:"eiqi",I:"ai",J:"jie",K:"kei",L:"ailu",M:"aimu",N:"ainu",O:"ou",P:"pi",Q:"kiu",R:"aer",S:"aisi",T:"ti",U:"you",V:"wei",W:"dabuliu",X:"eikesi",Y:"wai",Z:"zei" };
function toPinyin(s) {
  const t = [], re = /[一-鿿]+|[A-Za-z]/g; let m;
  while ((m = re.exec(s))) {
    if (/[一-鿿]/.test(m[0])) t.push(...pinyinFn(m[0], { toneType: "none", type: "array" }));
    else t.push(LETTER_PINYIN[m[0].toUpperCase()] || m[0].toLowerCase());
  }
  return t;
}
function overlapScore(said, ref) {
  const a = toPinyin(said), b = toPinyin(ref), set = new Set();
  for (let i = 0; i < a.length - 1; i++) set.add(a[i] + " " + a[i + 1]);
  let hit = 0, total = 0;
  for (let i = 0; i < b.length - 1; i++) { total++; if (set.has(b[i] + " " + b[i + 1])) hit++; }
  return total ? Math.round(hit / total * 100) : 0;
}
function segRecorder(getRef, label) {

      mr.start(); rec = true; btn.textContent = "■ 停止"; btn.classList.add("on"); st.textContent = "录音中…";

}

  // 画板
  const cv = $q("canvas"), ctx = cv.getContext("2d"); let drawing = false;
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };   // 画布显示比 320×240 小，按比例换算
  cv.onpointerdown = e => { drawing = true; ctx.beginPath(); ctx.moveTo(...pos(e)); };
  cv.onpointermove = e => { if (drawing) { ctx.lineTo(...pos(e)); ctx.stroke(); } };
  window.addEventListener("pointerup", () => drawing = false);
  $q(".clr").onclick = () => ctx.clearRect(0, 0, cv.width, cv.height);
  // 画图保存 & 图库
  const galleryDiv = $q(".draw-gallery");
  function refreshGallery() {
    const saves = loadDrawings(); galleryDiv.style.display = saves.length ? "flex" : "none"; galleryDiv.innerHTML = "";
    saves.forEach(s => {
      const thumb = document.createElement("div"); thumb.className = "draw-thumb";
      const tImg = document.createElement("img"); tImg.src = s.dataUrl;
      const lbl = document.createElement("div"); lbl.className = "dlbl"; lbl.textContent = "Q" + s.qNum;
      thumb.append(tImg, lbl); thumb.onclick = () => window.open(s.dataUrl); galleryDiv.appendChild(thumb);
    });
  }
  refreshGallery();
  $q(".save").onclick = () => {
    saveDrawing(cv.toDataURL(), qid, qNum); refreshGallery();
    const btn = $q(".save"); if (!btn) return; btn.textContent = "✅ 已保存";
    setTimeout(() => { const b = $q(".save"); if (b) b.textContent = "💾 保存这张图"; }, 1500);
  };
  const audio = new Audio(); mediaEls.push(audio);
  const byPair = {}; q.steps.forEach(s => (byPair[s.pair] ??= []).push(s));
  const columns = Object.values(byPair), qText = $q("#curQuestion"), segs = $q(".segments"), REVEAL = 5;
  let sentMode = false;
  function colEl(pair, n) {
    const w = document.createElement("div"); w.className = "col";
    const prompts = pair.filter(s => s.kind !== "answer");
    const answers = pair.filter(s => s.kind === "answer");
    // 问号/旁白在上
    prompts.forEach(s => {
      const b = document.createElement("button"); b.textContent = s.kind === "prompt" ? "❓ " + n : "🔊 " + n; s._plays = 0;
      b.onclick = () => {
        audio.pause(); cancelStop(audio); $q(".sentctl").replaceChildren(); audio.src = url(base + "audio/" + s.audio); audio.play();   // 清掉上一个分句的"到句尾就停"
        segs.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on", "done");
        s._plays++; qText.textContent = s._plays >= REVEAL ? (s.text || "") : "🔊 已听 " + s._plays + " / " + REVEAL + " 遍，听不懂就多听几遍，满" + REVEAL + "遍会显示文字";
      };
      w.appendChild(b);
    });
    // 灯泡在下（支持多个）
    if (answers.length) {
      const aBox = document.createElement("div"); aBox.style.cssText = "display:flex;flex-direction:column;gap:6px;margin-top:6px";
      answers.forEach(s => {
        const b = document.createElement("button"), ctl = $q(".sentctl");      // 分句控制条所有回答共用一条，不再撑高每一列
        b.textContent = "💡"; s._plays = 0;
        b.onclick = async () => {
          audio.pause(); cancelStop(audio); audio.src = url(base + "audio/" + s.audio);
          segs.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on", "done");
          if (!sentMode) { ctl.replaceChildren(); $q(".sentedit")?.replaceChildren(); audio.play(); return; }
          // 起点：管理员手动改过的(visual_cuts)优先，没有就用自动分句
          const key = base + "audio/" + s.audio;
          const auto = s._auto ??= (s.words?.length ? wordCuts(s.words) : await sentenceCuts(audio.src, s.text)).map(c => c[0]);
          const starts = s._starts = cutOv[key] ? cutOv[key].slice() : auto.slice();
          const P = await loadPeaks(audio.src).catch(() => null);   // 按真实波形找每句的开口/说完（失败就退回按起点）
          let cuts = refineCuts(starts, P), i = 0;
          const label = document.createElement("span"), mk = (t, f) => { const x = document.createElement("button"); x.textContent = t; x.onclick = f; return x; };
          const prev = mk("⏮ 上一句", () => { i--; play(); }), again = mk("🔁 重听", () => play()), next = mk("下一句 ⏭", () => { i++; play(); });
          const upd = () => { label.textContent = " 第 " + (i + 1) + " / " + cuts.length + " 句 "; prev.disabled = i <= 0; next.disabled = i >= cuts.length - 1; };
          const play = () => {
            audio.pause(); audio.currentTime = cuts[i][0]; audio.play();
            cancelStop(audio); if (isFinite(cuts[i][1])) stopAtEnd(audio, cuts[i][1]);
            upd();
          };
          ctl.replaceChildren(prev, again, next, label); play();
          if (isAdmin()) {   // 管理员：打开时间轴编辑器调整这个回答的分句
            const eb = document.createElement("button"); eb.textContent = "🎬 调整分句位置（时间轴）";
            eb.onclick = () => { audio.pause(); openCutEditor({ src: audio.src, isVideo: false, title: "调整分句：" + s.audio, id: key, starts, auto, words: s.words,
              onDone: () => { cuts = refineCuts(starts, P); i = Math.min(i, cuts.length - 1); upd(); } }); };
            $q(".sentedit").replaceChildren(eb, Object.assign(document.createElement("span"), { textContent: cutOv[key] ? "已用人工分句" : "自动分句", style: "font-size:12px;color:var(--muted)" }));
          }
        };
        aBox.append(b);
      });
      w.appendChild(aBox);
    }
    return w;
  }
  function renderGroups(n) {
    cancelStop(audio); $q(".sentctl").replaceChildren(); $q(".sentedit")?.replaceChildren();
    segs.innerHTML = "";
    for (let i = 0; i < columns.length; i += n) {
      const chunk = columns.slice(i, i + n), seg = document.createElement("div"); seg.className = "seg";
      const row = document.createElement("div"); row.className = "colsRow";
      chunk.forEach((p, k) => row.appendChild(colEl(p, i + k + 1)));
      seg.append(row, segRecorder(() => chunk.flat().map(s => s.text || "").join(""), chunk.length > 1 ? (i + 1) + "-" + (i + chunk.length) : String(i + 1)));
      segs.appendChild(seg);
    }
  }
  const tabs = $q(".tabsrow");   // 一行放下：几组一起 ｜ 整句/分句播放（两组各自有"选中"状态）
  [1, 2, 3, 4].forEach(n => { const t = document.createElement("button"); t.className = "tab gtab" + (n === 1 ? " active" : ""); t.textContent = n === 1 ? "1组一起" : n + "组一起";
    t.onclick = () => { tabs.querySelectorAll(".gtab").forEach(x => x.classList.remove("active")); t.classList.add("active"); renderGroups(n); }; tabs.appendChild(t); });
  const sep = document.createElement("span"); sep.textContent = "｜"; sep.style.color = "var(--border)"; tabs.appendChild(sep);
  [["整句播放", false], ["分句播放", true]].forEach(([name, v]) => { const t = document.createElement("button"); t.className = "tab mtab" + (!v ? " active" : ""); t.textContent = name;
    t.onclick = () => { sentMode = v; tabs.querySelectorAll(".mtab").forEach(x => x.classList.remove("active")); t.classList.add("active"); renderGroups(+tabs.querySelector(".gtab.active").textContent[0]); }; tabs.appendChild(t); });
  const sc = document.createElement("div"); sc.className = "sentctl"; sc.style.marginLeft = "auto"; tabs.appendChild(sc);   // 分句控制条放在选项同一行右侧，不占新的一行
  renderGroups(1);
}


// ---------- 启动：刷新页面时恢复登录 ----------
try { const u = sessionStorage.getItem("vt_user"); if (u) { user = JSON.parse(u); enterCourse(); } } catch (e) {}
</script>

// 按讲稿分句（规则来自老师给的切分示例）
function splitSents(text) {
  const MARK = "\u0001";
  let t = (text || "").replace(/(?<=[。！？!?；;])/g, MARK)
    .replace(/(?=又因为|再根据|同理|来求得|(?<!乘上?)乙完成|-[角A-Za-z])/g, MARK)
    .replace(/(?<![，,。么])(?=我们(?:发现|可得|可以|可知))/g, MARK);
  let parts = t.split(MARK).filter(x => x.trim()), out = [];
  for (let p of parts) {
    for (;;) {                                   // 超 40 字的长句：连等式在第 3 个"等于"前断；"，那么/所以…"在逗号后断
      if (p.length <= 40) break;
      const eq = [...p.matchAll(/等于/g)].map(m => m.index);
      let k = eq.length >= 3 ? eq[2] : -1;
      if (k < 0) {
        const c = [...p.matchAll(/(?<=[，,])(?=那么|所以|则|即|得到|可得|我们)/g)].map(m => m.index).sort((a, b) => Math.abs(a - p.length / 2) - Math.abs(b - p.length / 2));
        k = c.length ? c[0] : -1;
      }
      if (k <= 0 || k >= p.length) break;
      out.push(p.slice(0, k)); p = p.slice(k);
    }
    out.push(p);
  }
  const res = [];                                // 少于 8 字的碎片并入下一句（最后一句并入上一句）
  for (const x of out) { if (res.length && res[res.length - 1].length < 8) res[res.length - 1] += x; else res.push(x); }
  if (res.length > 1 && res[res.length - 1].length < 8) { const t2 = res.pop(); res[res.length - 1] += t2; }
  return res;
}
// 按讲稿文字分句（见 splitSents），每句的时间按字数比例估算，再吸附到附近的停顿（±1.5s）；没有文字时只按停顿切
async function sentenceCuts(src, text) {
  const buf = await (await fetch(src)).arrayBuffer();
  const ac = new (window.AudioContext || window.webkitAudioContext)(), d = (await ac.decodeAudioData(buf)).getChannelData(0), sr = ac.sampleRate; ac.close();
  const W = Math.floor(sr * 0.02), rms = [];
  for (let i = 0; i + W <= d.length; i += W) { let t = 0; for (let k = i; k < i + W; k++) t += d[k] * d[k]; rms.push(Math.sqrt(t / W)); }
  const th = Math.max(0.005, Math.max(...rms) * 0.05), dur = d.length / sr, gaps = [];
  for (let i = 0, st = -1; i <= rms.length; i++) {
    const q = i < rms.length && rms[i] < th;
    if (q && st < 0) st = i;
    if (!q && st >= 0) { if ((i - st) * 0.02 >= 0.25) gaps.push((st + i) / 2 * 0.02); st = -1; }
  }
  const sents = splitSents(text);
  let cuts;
  if (sents.length > 1) {
    const total = sents.reduce((n, x) => n + x.length, 0); let acc = 0;
    cuts = sents.slice(0, -1).map(x => {
      acc += x.length; const t = acc / total * dur;
      const near = gaps.filter(g => Math.abs(g - t) <= 1.5).sort((p, q) => Math.abs(p - t) - Math.abs(q - t))[0];
      return near ?? t;
    });
  } else cuts = gaps.filter(c => c > 1 && dur - c > 1);
  const out = []; let a = 0;
  for (const c of cuts.sort((p, q) => p - q)) if (c > a + 0.3) { out.push([a, c]); a = c; }
  out.push([a, dur]);
  return out;
}
const drawKey = () => `vt_draw_${user.referrer}_${user.studentNo}_${bjToday()}`;

}

const GRADES = { 小学: ["一年级", "二年级", "三年级", "四年级", "五年级", "六年级"], 初中: ["初一", "初二", "初三"], 高中: ["高一", "高二", "高三"] };
function chip(parent, text, active, empty, onclick) {
  const b = document.createElement("button"); b.className = "tab" + (active ? " active" : "") + (empty ? " empty" : ""); b.textContent = text; b.onclick = onclick; parent.appendChild(b);

const courseOf = () => index.courses.find(c => c.mode === sel.mode && c.grade === sel.grade && c.term === sel.term && c.subject === sel.subject);

  $("stageTabs").innerHTML = ""; ["小学", "初中", "高中"].forEach(s => chip($("stageTabs"), s, s === sel.stage, false, () => { sel.stage = s; sel.grade = GRADES[s][0]; sel.term = "上"; renderCourse(); }));
  $("modeTabs").innerHTML = ""; ["gen1", "gen2"].forEach(m => chip($("modeTabs"), MODE_NAME[m], m === sel.mode, false, () => { sel.mode = m; renderCourse(); }));
  $("modeHint").textContent = MODE_HINT[sel.mode];
  $("subjectTabs").innerHTML = "";
  const allSubs = sel.stage === "初中" ? ["数学", "物理", "化学"] : sel.stage === "高中" ? ["数学", "物理"] : ["数学"];
  if (!allSubs.includes(sel.subject)) sel.subject = allSubs[0];

  }));

  else course.chapters.forEach(ch => {

// ---------- 学习界面 ----------
async function openChapter(course, ch, startQid) {
  const manifest = await (await fetch(CONTENT + ch.dir + "/manifest.json", { cache: "no-cache" })).json();
  cur = { course, chapter: ch, manifest, qi: 0 };
  if (startQid) { const i = manifest.questions.findIndex(q => q.id === startQid); if (i >= 0) cur.qi = i; }

}
$("backBtn").onclick = () => { stopMedia(); enterCourse(); };
function unlocked(i) { const qs = cur.manifest.questions; return i === 0 || !!status[qidOf(cur.chapter.dir, qs[i - 1])]; }
function renderPills() {
  const today = bjToday();

let mediaEls = [];

// ---------- 录音 + 提交给老师批改（两种版本共用）----------
let micStream = null;
async function getMic() { return micStream ??= await navigator.mediaDevices.getUserMedia({ audio: true }); }

// 录音 -> 回听 -> 重录/提交；setEnabled 用来在看完视频之前锁住录音
function makeSubmitter(qid, onSubmitted) {
  const el = document.createElement("div"); el.className = "recbar";
  const main = document.createElement("button"), st = document.createElement("div"), review = document.createElement("div");
  st.className = "status"; el.append(main, st, review);
  let enabled = true, lockText = "", mr, chunks = [], recording = false, blob = null;
  let _onRecStart = null, _onRecEnd = null;
  const sent = () => status[qid] && status[qid].status !== "retry";   // 交过且老师没让重录 → 锁定
  const idle = () => {
    main.textContent = sent() ? (status[qid].status === "pass" ? "☑️ 老师已通过" : "⏳ 已提交，等待老师批改") : enabled ? (status[qid] ? "🎙 重新录一遍" : "🎙 开始复述") : lockText;
    main.disabled = sent() || !enabled; main.className = "main btn-green";
  };
  idle();
  main.onclick = async () => {
    if (!recording) {
      let stream; try { stream = await getMic(); } catch (e) { st.textContent = "⚠ 无法使用麦克风，请允许浏览器使用麦克风后重试"; return; }
      mr = new MediaRecorder(stream); chunks = []; review.innerHTML = "";
      mr.ondataavailable = e => chunks.push(e.data); mr.onstop = onStop;
      mr.start(); recording = true; main.textContent = "■ 说完了，点这里停止"; main.className = "main btn-red"; st.textContent = "录音中…";
      if (_onRecStart) _onRecStart();
    } else { mr.stop(); recording = false; idle(); if (_onRecEnd) _onRecEnd(); }
  };
  function onStop() {
    blob = new Blob(chunks, { type: "audio/webm" });
    st.textContent = "先听一下自己的录音，满意就提交给老师";
    review.innerHTML = "";
    const a = document.createElement("audio"); a.controls = true; a.src = URL.createObjectURL(blob);
    const acts = document.createElement("div"); acts.className = "acts";
    const redo = document.createElement("button"); redo.textContent = "🔄 重录";
    const sub = document.createElement("button"); sub.className = "btn-blue"; sub.textContent = "📤 提交给老师批改";
    redo.onclick = () => { review.innerHTML = ""; st.textContent = ""; };
    sub.onclick = async () => {
      sub.disabled = redo.disabled = true; st.textContent = "正在提交…";
      try {
        const r = await sbPost("visual_recordings", [{ referral_code: user.referrer, student_no: user.studentNo, question_id: qid, audio_base64: await blobToBase64(blob) }]);
        if (!r.ok) throw new Error("HTTP " + r.status);
        status[qid] = { status: "pending", feedback: null, created_at: new Date().toISOString() };
        review.innerHTML = ""; st.innerHTML = "✅ 已提交，<b>等待老师批改</b>。可以继续下一题。";
        idle(); onSubmitted();
      } catch (e) { st.textContent = "⚠ 提交失败：" + e.message + "，录音还在，请再点一次提交"; sub.disabled = redo.disabled = false; }
    };
    acts.append(redo, sub); review.append(a, acts);
  }
  return { el, setEnabled(on, text) { enabled = on; lockText = text || ""; if (!recording && !review.children.length) idle(); }, setRecordCallbacks(onStart, onEnd) { _onRecStart = onStart; _onRecEnd = onEnd; } };
}


// 录音时自动藏题；返回"查看题目/再次隐藏"按钮，由调用方放到页面里

// ---------- 纯享版：左题目、右视频，看完视频才能录音 ----------

  const sentBox = document.createElement("div"); sentBox.style.marginTop = "10px";
  let sentMode = false, gsize = 1, gi = 0, groups = [];

    t.className = "tab" + (v === cur ? " active" : ""); t.textContent = name; t.onclick = () => on(v); r.appendChild(t); }); return r; };

      ctl.append(mk("▶ 播放这一组", playGroup), mk("⏮ 上一组", () => { gi--; playGroup(); }, gi <= 0), mk("下一组 ⏭", () => { gi++; playGroup(); }, gi >= groups.length - 1), label);
      const rec = segRecorder(() => groups[gi].text, "按组录：第 " + (gi + 1) + " 组");

let pinyinFn = null, asrPipe = null;
const HAS_WEBGPU = !!navigator.gpu;

    : await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js");
  return asrPipe = HAS_WEBGPU ? await pipeline("automatic-speech-recognition", "onnx-community/whisper-small", { device: "webgpu" })

// 按拼音(不管声调)比对，同音字不算错；"角B"这类单个英文字母按字母名读音比
const LETTER_PINYIN = { A:"ei",B:"bi",C:"xi",D:"di",E:"yi",F:"aifu",G:"ji",H:"eiqi",I:"ai",J:"jie",K:"kei",L:"ailu",M:"aimu",N:"ainu",O:"ou",P:"pi",Q:"kiu",R:"aer",S:"aisi",T:"ti",U:"you",V:"wei",W:"dabuliu",X:"eikesi",Y:"wai",Z:"zei" };
function toPinyin(s) {
  const t = [], re = /[一-鿿]+|[A-Za-z]/g; let m;
  while ((m = re.exec(s))) {
    if (/[一-鿿]/.test(m[0])) t.push(...pinyinFn(m[0], { toneType: "none", type: "array" }));
    else t.push(LETTER_PINYIN[m[0].toUpperCase()] || m[0].toLowerCase());
  }

}
function overlapScore(said, ref) {
  const a = toPinyin(said), b = toPinyin(ref), set = new Set();
  for (let i = 0; i < a.length - 1; i++) set.add(a[i] + " " + a[i + 1]);
  let hit = 0, total = 0;
  for (let i = 0; i < b.length - 1; i++) { total++; if (set.has(b[i] + " " + b[i + 1])) hit++; }
  return total ? Math.round(hit / total * 100) : 0;
}
function segRecorder(getRef, label) {

      mr.start(); rec = true; btn.textContent = "■ 停止"; btn.classList.add("on"); st.textContent = "录音中…";
    } else { mr.stop(); rec = false; btn.textContent = idle; btn.classList.remove("on"); btn.disabled = true; }

    });
  }
  refreshGallery();
  $q(".save").onclick = () => {
    saveDrawing(cv.toDataURL(), qid, qNum); refreshGallery();
    const btn = $q(".save"); if (!btn) return; btn.textContent = "✅ 已保存";
    setTimeout(() => { const b = $q(".save"); if (b) b.textContent = "💾 保存这张图"; }, 1500);
  };
  const audio = new Audio(); mediaEls.push(audio);
  const byPair = {}; q.steps.forEach(s => (byPair[s.pair] ??= []).push(s));
  const columns = Object.values(byPair), qText = $q("#curQuestion"), segs = $q(".segments"), REVEAL = 5;
  let sentMode = false;
  function colEl(pair, n) {
    const w = document.createElement("div"); w.className = "col";
    const prompts = pair.filter(s => s.kind !== "answer");
    const answers = pair.filter(s => s.kind === "answer");
    // 问号/旁白在上
    prompts.forEach(s => {
      const b = document.createElement("button"); b.textContent = s.kind === "prompt" ? "❓ " + n : "🔊 " + n; s._plays = 0;
      b.onclick = () => {
        audio.pause(); audio.src = url(base + "audio/" + s.audio); audio.play();
        segs.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on", "done");
        s._plays++; qText.textContent = s._plays >= REVEAL ? (s.text || "") : "🔊 已听 " + s._plays + " / " + REVEAL + " 遍，听不懂就多听几遍，满" + REVEAL + "遍会显示文字";
      };
      w.appendChild(b);
    });
    // 灯泡在下（支持多个）
    if (answers.length) {
      const aBox = document.createElement("div"); aBox.style.cssText = "display:flex;flex-direction:column;gap:6px;margin-top:6px";
      answers.forEach(s => {
        const b = document.createElement("button"), ctl = document.createElement("div");
        b.textContent = "💡"; s._plays = 0; ctl.className = "row"; ctl.style.display = "none";
        b.onclick = async () => {
          audio.pause(); audio.ontimeupdate = null; audio.src = url(base + "audio/" + s.audio);
          segs.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on", "done");
          if (!sentMode) { ctl.style.display = "none"; audio.play(); return; }
          const cuts = s._cuts ??= await sentenceCuts(audio.src, s.text); let i = 0;
          const label = document.createElement("span"), mk = (t, f) => { const x = document.createElement("button"); x.textContent = t; x.onclick = f; return x; };
          const prev = mk("⏮ 上一句", () => { i--; play(); }), again = mk("🔁 重听", () => play()), next = mk("下一句 ⏭", () => { i++; play(); });
          const play = () => {
            audio.pause(); audio.currentTime = cuts[i][0]; audio.play();
            audio.ontimeupdate = () => { if (audio.currentTime >= cuts[i][1]) { audio.pause(); audio.ontimeupdate = null; } };
            label.textContent = " 第 " + (i + 1) + " / " + cuts.length + " 句 "; prev.disabled = i <= 0; next.disabled = i >= cuts.length - 1;
          };
          ctl.replaceChildren(prev, again, next, label); ctl.style.display = ""; play();
        };
        aBox.append(b, ctl);
      });
      w.appendChild(aBox);
    }
    return w;
  }
  function renderGroups(n) {
    segs.innerHTML = "";
    for (let i = 0; i < columns.length; i += n) {
      const chunk = columns.slice(i, i + n), seg = document.createElement("div"); seg.className = "seg";
      const row = document.createElement("div"); row.className = "colsRow";
      chunk.forEach((p, k) => row.appendChild(colEl(p, i + k + 1)));
      seg.append(row, segRecorder(() => chunk.flat().map(s => s.text || "").join(""), chunk.length > 1 ? (i + 1) + "-" + (i + chunk.length) : String(i + 1)));
      segs.appendChild(seg);
    }
  }
  const modeRow = document.createElement("div"); modeRow.className = "row";
  [["整句播放", false], ["分句播放", true]].forEach(([name, v]) => { const t = document.createElement("button"); t.className = "tab" + (!v ? " active" : ""); t.textContent = name;
    t.onclick = () => { sentMode = v; modeRow.querySelectorAll(".tab").forEach(x => x.classList.remove("active")); t.classList.add("active"); renderGroups(+$q(".tabsrow .active").textContent[0]); }; modeRow.appendChild(t); });
  $q(".tabsrow").after(modeRow);
  const tabs = $q(".tabsrow");
  [1, 2, 3, 4].forEach(n => { const t = document.createElement("button"); t.className = "tab" + (n === 1 ? " active" : ""); t.textContent = n === 1 ? "1组一起" : n + "组一起";
    t.onclick = () => { tabs.querySelectorAll(".tab").forEach(x => x.classList.remove("active")); t.classList.add("active"); renderGroups(n); }; tabs.appendChild(t); });
  renderGroups(1);
}


// ---------- 启动：刷新页面时恢复登录 ----------
try { const u = sessionStorage.getItem("vt_user"); if (u) { user = JSON.parse(u); enterCourse(); } } catch (e) {}
</script>

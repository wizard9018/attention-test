<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清良思维 · 管理后台</title>
<style>
  :root {
    --ink: #10131a;
    --brass: #b08d57;
    --brass-bright: #d9b980;
    --paper: #f7f5ef;
    --line: #e6e1d6;
    --slate: #5b6472;
    --green: #58cc02;
    --blue: #1cb0f6;
    --red: #ff4b4b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  header {
    background: var(--ink);
    color: #fff;
    padding: 16px max(20px, calc((100% - 1100px)/2));
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand { font-weight: 900; font-size: 1.1rem; }
  header .brand span { color: var(--brass-bright); font-weight: 700; font-size: 0.8rem; margin-left: 8px; }
  #logoutBtn {
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

  /* login */
  #loginScreen {
    min-height: calc(100vh - 64px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 36px 32px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 8px 30px rgba(16,19,26,0.08);
  }
  .login-card h2 { margin: 0 0 22px; font-size: 1.2rem; text-align: center; }
  .login-card label { display: block; font-size: 0.82rem; font-weight: 800; color: var(--slate); margin: 14px 0 6px; }
  .login-card input {
    width: 100%;
    padding: 11px 14px;
    border: 2px solid var(--line);
    border-radius: 10px;
    font-size: 0.95rem;
  }
  .login-card input:focus { outline: none; border-color: var(--brass); }
  #loginBtn {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--green);
    color: #fff;
    font-weight: 900;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #loginError { color: var(--red); font-size: 0.82rem; margin-top: 10px; display: none; text-align: center; }

  /* records */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  #searchInput {
    flex: 1 1 260px;
    padding: 10px 14px;
    border: 2px solid var(--line);
    border-radius: 10px;
    font-size: 0.9rem;
  }
  #searchInput:focus { outline: none; border-color: var(--brass); }
  .toolbar button {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #refreshBtn { background: var(--blue); color: #fff; }
  #recordCount { font-size: 0.82rem; color: var(--slate); margin-bottom: 12px; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(16,19,26,0.06); }
  th, td { padding: 12px 14px; text-align: left; font-size: 0.86rem; border-bottom: 1px solid var(--line); }
  th { background: #faf8f3; color: var(--slate); font-weight: 800; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr { cursor: pointer; transition: background 0.15s; }
  tbody tr:hover { background: rgba(217,185,128,0.08); }
  tbody tr:last-child td { border-bottom: none; }
  .score-cell { font-weight: 900; }
  #emptyNote { text-align: center; padding: 40px; color: var(--slate); display: none; }

  /* report detail */
  #reportOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(16,19,26,0.55);
    z-index: 100;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: 40px 16px;
  }
  #reportPanel {
    background: #fff;
    border-radius: 18px;
    max-width: 760px;
    width: 100%;
    padding: 30px 30px 34px;
    position: relative;
  }
  #reportClose {
    position: absolute; top: 16px; right: 16px;
    background: var(--paper); border: none; border-radius: 50%;
    width: 32px; height: 32px; font-size: 1rem; cursor: pointer;
  }
  .report-head { border-bottom: 2px solid var(--line); padding-bottom: 16px; margin-bottom: 20px; }
  .report-head h3 { margin: 0 0 6px; font-size: 1.25rem; }
  .report-meta { font-size: 0.84rem; color: var(--slate); }
  .report-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .report-stat { background: var(--paper); border-radius: 12px; padding: 14px; text-align: center; }
  .report-stat .num { font-size: 1.5rem; font-weight: 900; color: var(--brass); font-variant-numeric: tabular-nums; }
  .report-stat .lbl { font-size: 0.76rem; color: var(--slate); margin-top: 4px; }
  .report-section-title { font-weight: 900; font-size: 0.95rem; margin: 22px 0 10px; }
  .history-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 0.84rem; }
  .history-row:last-child { border-bottom: none; }
  .pass-tag { font-weight: 800; }
  .pass-tag.yes { color: var(--green); }
  .pass-tag.no { color: var(--red); }
  .no-data { color: var(--slate); font-size: 0.84rem; padding: 8px 0; }
</style>
</head>
<body>

<header>
  <div class="brand">清良思维 <span>管理后台</span></div>
  <button id="logoutBtn" style="display:none;">退出登录</button>
</header>

<div id="loginScreen">
  <div class="login-card">
    <h2>🔒 管理员登录</h2>
    <label>用户名</label>
    <input type="text" id="loginUser" autocomplete="off">
    <label>密码</label>
    <input type="password" id="loginPass" autocomplete="off">
    <button id="loginBtn">登录</button>
    <p id="loginError">用户名或密码错误</p>
  </div>
</div>

<main id="mainScreen" style="display:none;">
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="按手机号/微信号或学校搜索...">
    <button id="refreshBtn">🔄 刷新</button>
  </div>
  <div id="recordCount"></div>
  <table>
    <thead>
      <tr>
        <th>学生姓名</th>
        <th>学校</th>
        <th>手机号/微信号</th>
        <th>年龄</th>
        <th>听觉得分</th>
        <th>视觉得分</th>
        <th>综合总分</th>
        <th>测评日期</th>
      </tr>
    </thead>
    <tbody id="recordsBody"></tbody>
  </table>
  <p id="emptyNote">暂无数据</p>
</main>

<div id="reportOverlay">
  <div id="reportPanel">
    <button id="reportClose">✕</button>
    <div id="reportContent"></div>
  </div>
</div>

<script>
(function(){
  var SUPABASE_URL = "https://knhpwhdgzwhdpnbsrbty.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuaHB3aGRnendoZHBuYnNyYnR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNzM5MzIsImV4cCI6MjEwNDc0OTkzMn0.Nsd_fxNquX-_hTLyKwteHuezgp2HI4-rNWiMC-XTohI";
  var SUPABASE_TABLE = "attention_test_records";

  var loginScreen = document.getElementById("loginScreen");
  var mainScreen = document.getElementById("mainScreen");
  var logoutBtn = document.getElementById("logoutBtn");
  var loginUser = document.getElementById("loginUser");
  var loginPass = document.getElementById("loginPass");
  var loginBtn = document.getElementById("loginBtn");
  var loginError = document.getElementById("loginError");
  var searchInput = document.getElementById("searchInput");
  var refreshBtn = document.getElementById("refreshBtn");
  var recordsBody = document.getElementById("recordsBody");
  var recordCount = document.getElementById("recordCount");
  var emptyNote = document.getElementById("emptyNote");
  var reportOverlay = document.getElementById("reportOverlay");
  var reportClose = document.getElementById("reportClose");
  var reportContent = document.getElementById("reportContent");

  var allRecords = [];

  function escapeHtml(str) {
    if(!str) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function supabaseHeaders() {
    return { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY };
  }

  function showMain() {
    loginScreen.style.display = "none";
    mainScreen.style.display = "block";
    logoutBtn.style.display = "inline-block";
    loadRecords();
  }

  function doLogin() {
    if(loginUser.value === "admin" && loginPass.value === "admin") {
      sessionStorage.setItem("qlsw_admin_auth", "1");
      loginError.style.display = "none";
      showMain();
    } else {
      loginError.style.display = "block";
    }
  }
  loginBtn.addEventListener("click", doLogin);
  loginPass.addEventListener("keydown", function(e){ if(e.key === "Enter") doLogin(); });
  loginUser.addEventListener("keydown", function(e){ if(e.key === "Enter") doLogin(); });

  logoutBtn.addEventListener("click", function(){
    sessionStorage.removeItem("qlsw_admin_auth");
    loginScreen.style.display = "flex";
    mainScreen.style.display = "none";
    logoutBtn.style.display = "none";
    loginUser.value = "";
    loginPass.value = "";
  });

  function loadRecords() {
    var url = SUPABASE_URL + "/rest/v1/" + SUPABASE_TABLE +
      "?select=record_id,player_name,player_school,player_phone,player_age,auditory_score,visual_score,total_score,test_date,raw_details" +
      "&order=created_at.desc&limit=500";
    recordCount.textContent = "加载中...";
    fetch(url, { headers: supabaseHeaders() })
      .then(function(res){ return res.json(); })
      .then(function(list){
        allRecords = Array.isArray(list) ? list : [];
        renderRecords(allRecords);
      })
      .catch(function(err){
        recordCount.textContent = "加载失败，请检查网络后点击刷新";
        console.warn(err);
      });
  }

  function renderRecords(records) {
    recordsBody.innerHTML = "";
    recordCount.textContent = "共 " + records.length + " 条记录";
    if(records.length === 0) {
      emptyNote.style.display = "block";
      return;
    }
    emptyNote.style.display = "none";
    records.forEach(function(rec){
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td style='font-weight:800;'>" + escapeHtml(rec.player_name) + "</td>" +
        "<td>" + escapeHtml(rec.player_school) + "</td>" +
        "<td>" + escapeHtml(rec.player_phone) + "</td>" +
        "<td>" + (rec.player_age || "-") + "</td>" +
        "<td class='score-cell' style='color:var(--blue);'>" + rec.auditory_score + "</td>" +
        "<td class='score-cell' style='color:var(--green);'>" + rec.visual_score + "</td>" +
        "<td class='score-cell' style='color:var(--brass);'>" + rec.total_score + "</td>" +
        "<td style='color:var(--slate); font-size:0.8rem;'>" + (rec.test_date || "") + "</td>";
      tr.addEventListener("click", function(){ openReport(rec); });
      recordsBody.appendChild(tr);
    });
  }

  searchInput.addEventListener("input", function(){
    var q = searchInput.value.trim().toLowerCase();
    if(!q) { renderRecords(allRecords); return; }
    var filtered = allRecords.filter(function(rec){
      return (rec.player_phone && rec.player_phone.toLowerCase().indexOf(q) !== -1) ||
             (rec.player_school && rec.player_school.toLowerCase().indexOf(q) !== -1);
    });
    renderRecords(filtered);
  });

  refreshBtn.addEventListener("click", loadRecords);

  function historyRowsHtml(list, kind) {
    if(!list || list.length === 0) return '<p class="no-data">无详细记录</p>';
    return list.map(function(h){
      if(kind === "auditory") {
        var pass = h.isPass;
        return '<div class="history-row"><span>第 ' + h.level + ' 级 · 第 ' + h.attemptNumber + ' 次尝试</span>' +
          '<span>准确率 ' + (h.accuracy != null ? Math.round(h.accuracy * 100) + '%' : '-') + ' · <span class="pass-tag ' + (pass ? 'yes' : 'no') + '">' + (pass ? '通过' : '未通过') + '</span></span></div>';
      } else {
        var pass2 = h.passed;
        return '<div class="history-row"><span>第 ' + h.level + ' 级</span>' +
          '<span>准确率 ' + (h.accuracy != null ? Math.round(h.accuracy * 100) + '%' : '-') + ' · 命中 ' + (h.hits != null ? h.hits : '-') + ' / 误报 ' + (h.misses != null ? h.misses : '-') + ' · <span class="pass-tag ' + (pass2 ? 'yes' : 'no') + '">' + (pass2 ? '通过' : '未通过') + '</span></span></div>';
      }
    }).join("");
  }

  function openReport(rec) {
    var raw = rec.raw_details || {};
    var auditoryPassed = raw.auditoryPassed || [];
    var visualPassed = raw.visualPassed || [];
    reportContent.innerHTML =
      '<div class="report-head">' +
        '<h3>📊 ' + escapeHtml(rec.player_name) + ' 的专注力测评报告</h3>' +
        '<div class="report-meta">' + escapeHtml(rec.player_school) + ' · ' + escapeHtml(rec.player_phone) + ' · ' + (rec.player_age || '-') + ' 岁 · ' + (rec.test_date || '') + '</div>' +
      '</div>' +
      '<div class="report-stats">' +
        '<div class="report-stat"><div class="num" style="color:var(--blue);">' + rec.auditory_score + '</div><div class="lbl">听觉专注力等级</div></div>' +
        '<div class="report-stat"><div class="num" style="color:var(--green);">' + rec.visual_score + '</div><div class="lbl">视觉专注力等级</div></div>' +
        '<div class="report-stat"><div class="num">' + rec.total_score + '</div><div class="lbl">综合总分</div></div>' +
      '</div>' +
      '<div class="report-section-title">🎧 听觉序列记忆 · 逐级记录（已通过：' + (auditoryPassed.length ? auditoryPassed.join('、') + ' 级' : '无') + '）</div>' +
      historyRowsHtml(raw.auditoryHistory, "auditory") +
      '<div class="report-section-title">👁️ 视觉空间记忆 · 逐级记录（已通过：' + (visualPassed.length ? visualPassed.join('、') + ' 级' : '无') + '）</div>' +
      historyRowsHtml(raw.visualHistory, "visual");
    reportOverlay.style.display = "flex";
  }
  reportClose.addEventListener("click", function(){ reportOverlay.style.display = "none"; });
  reportOverlay.addEventListener("click", function(e){ if(e.target === reportOverlay) reportOverlay.style.display = "none"; });

  if(sessionStorage.getItem("qlsw_admin_auth") === "1") {
    showMain();
  }
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清良思维 · 管理后台</title>
<style>
  :root {
    --ink: #10131a;
    --brass: #b08d57;
    --brass-bright: #d9b980;
    --paper: #f7f5ef;
    --line: #e6e1d6;
    --slate: #5b6472;
    --green: #58cc02;
    --blue: #1cb0f6;
    --red: #ff4b4b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  header {
    background: var(--ink);
    color: #fff;
    padding: 16px max(20px, calc((100% - 1100px)/2));
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand { font-weight: 900; font-size: 1.1rem; }
  header .brand span { color: var(--brass-bright); font-weight: 700; font-size: 0.8rem; margin-left: 8px; }
  #logoutBtn {
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

  /* login */
  #loginScreen {
    min-height: calc(100vh - 64px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 36px 32px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 8px 30px rgba(16,19,26,0.08);
  }
  .login-card h2 { margin: 0 0 22px; font-size: 1.2rem; text-align: center; }
  .login-card label { display: block; font-size: 0.82rem; font-weight: 800; color: var(--slate); margin: 14px 0 6px; }
  .login-card input {
    width: 100%;
    padding: 11px 14px;
    border: 2px solid var(--line);
    border-radius: 10px;
    font-size: 0.95rem;
  }
  .login-card input:focus { outline: none; border-color: var(--brass); }
  #loginBtn {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--green);
    color: #fff;
    font-weight: 900;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #loginError { color: var(--red); font-size: 0.82rem; margin-top: 10px; display: none; text-align: center; }
  .login-switch { text-align: center; font-size: 0.82rem; color: var(--slate); margin-top: 16px; }
  .login-switch a { color: var(--blue); text-decoration: none; cursor: pointer; }
  #registerError, #registerSuccess { font-size: 0.82rem; margin-top: 10px; display: none; text-align: center; }

  @keyframes onAutoFillStart { from {} to {} }
  #loginUser:-webkit-autofill, #loginPass:-webkit-autofill { animation-name: onAutoFillStart; }
  #registerError { color: var(--red); }
  #registerSuccess { color: var(--green); }

  /* records */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  #searchInput {
    flex: 1 1 260px;
    padding: 10px 14px;
    border: 2px solid var(--line);
    border-radius: 10px;
    font-size: 0.9rem;
  }
  #searchInput:focus { outline: none; border-color: var(--brass); }
  .toolbar button {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #refreshBtn { background: var(--blue); color: #fff; }
  #recordCount { font-size: 0.82rem; color: var(--slate); margin-bottom: 12px; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(16,19,26,0.06); }
  th, td { padding: 12px 14px; text-align: left; font-size: 0.86rem; border-bottom: 1px solid var(--line); }
  th { background: #faf8f3; color: var(--slate); font-weight: 800; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr { cursor: pointer; transition: background 0.15s; }
  tbody tr:hover { background: rgba(217,185,128,0.08); }
  tbody tr:last-child td { border-bottom: none; }
  .score-cell { font-weight: 900; }
  #emptyNote { text-align: center; padding: 40px; color: var(--slate); display: none; }

  .campus-banner { font-size: 0.9rem; color: var(--slate); margin-bottom: 14px; display: none; }
  .campus-banner strong { color: var(--ink); }

  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(16,19,26,0.5);
    align-items: center; justify-content: center;
    z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: #fff;
    border-radius: 16px;
    padding: 28px 26px;
    width: 100%;
    max-width: 340px;
  }
  .modal-card h3 { margin: 0 0 18px; font-size: 1.05rem; }
  .modal-card label { display: block; font-size: 0.82rem; font-weight: 800; color: var(--slate); margin: 12px 0 6px; }
  .modal-card input {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--line);
    border-radius: 10px;
    font-size: 0.9rem;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; }
  #pwSaveBtn { background: var(--green); color: #fff; }
  #pwCancelBtn { background: #f1f0eb; color: var(--ink); }
  #pwError { color: var(--red); font-size: 0.8rem; margin-top: 10px; display: none; }
  #pwSuccess { color: var(--green); font-size: 0.8rem; margin-top: 10px; display: none; }
</style>
</head>
<body>

<header>
  <div class="brand">清良思维 <span>管理后台</span></div>
  <div style="display:flex; align-items:center; gap:10px;">
    <button id="changePwHeaderBtn" style="display:none;">修改密码</button>
    <button id="logoutBtn" style="display:none;">退出登录</button>
  </div>
</header>

<div id="loginScreen">
  <div class="login-card" id="loginCard">
    <h2>🔒 管理员登录</h2>
    <label>用户名 / 工号</label>
    <input type="text" id="loginUser" autocomplete="off">
    <label>密码</label>
    <input type="password" id="loginPass" autocomplete="off">
    <button id="loginBtn">登录</button>
    <p id="loginError">用户名或密码错误</p>
    <p class="login-switch">还没有工号账号？<a id="showRegisterLink">申请一个 →</a></p>
  </div>
  <div class="login-card" id="registerCard" style="display:none;">
    <h2>📝 申请校区工号</h2>
    <label>姓名 / 校区名称</label>
    <input type="text" id="regName" autocomplete="off">
    <label>手机号后5位（作为工号）</label>
    <input type="text" id="regTeacherId" maxlength="5" inputmode="numeric" autocomplete="off">
    <label>设置密码</label>
    <input type="password" id="regPass" autocomplete="off">
    <label>确认密码</label>
    <input type="password" id="regPass2" autocomplete="off">
    <button id="registerBtn">申请并登录</button>
    <p id="registerError"></p>
    <p id="registerSuccess">申请成功，正在登录…</p>
    <p class="login-switch">已有账号？<a id="showLoginLink">去登录 →</a></p>
  </div>
</div>

<main id="mainScreen" style="display:none;">
  <div class="campus-banner" id="campusBanner">校区：<strong id="campusNameText"></strong> · 工号：<strong id="teacherIdText"></strong></div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="按手机号/微信号或学校搜索...">
    <button id="refreshBtn">🔄 刷新</button>
  </div>
  <div id="recordCount"></div>
  <table>
    <thead>
      <tr>
        <th>学生姓名</th>
        <th>学校</th>
        <th>手机号/微信号</th>
        <th>年龄</th>
        <th>听觉得分</th>
        <th>视觉得分</th>
        <th>综合总分</th>
        <th>测评日期</th>
      </tr>
    </thead>
    <tbody id="recordsBody"></tbody>
  </table>
  <p id="emptyNote">暂无数据</p>
</main>

<div class="modal-backdrop" id="pwModalBackdrop">
  <div class="modal-card">
    <h3>修改密码</h3>
    <label>当前密码</label>
    <input type="password" id="pwOld" autocomplete="off">
    <label>新密码</label>
    <input type="password" id="pwNew" autocomplete="off">
    <label>确认新密码</label>
    <input type="password" id="pwNew2" autocomplete="off">
    <p id="pwError"></p>
    <p id="pwSuccess">密码已更新</p>
    <div class="modal-actions">
      <button id="pwCancelBtn">取消</button>
      <button id="pwSaveBtn">保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  var SUPABASE_URL = "https://knhpwhdgzwhdpnbsrbty.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuaHB3aGRnendoZHBuYnNyYnR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNzM5MzIsImV4cCI6MjEwNDc0OTkzMn0.Nsd_fxNquX-_hTLyKwteHuezgp2HI4-rNWiMC-XTohI";
  var SUPABASE_TABLE = "attention_test_records";
  var ADMINS_TABLE = "campus_admins";

  var loginScreen = document.getElementById("loginScreen");
  var mainScreen = document.getElementById("mainScreen");
  var logoutBtn = document.getElementById("logoutBtn");
  var changePwHeaderBtn = document.getElementById("changePwHeaderBtn");
  var loginUser = document.getElementById("loginUser");
  var loginPass = document.getElementById("loginPass");
  (function(){
    var userTyped = false;
    function markTyped(){ userTyped = true; }
    function clearOnAutofill(e){
      if(e.animationName === "onAutoFillStart" && !userTyped) { loginUser.value = ""; loginPass.value = ""; }
    }
    loginUser.addEventListener("input", markTyped, { once: true });
    loginPass.addEventListener("input", markTyped, { once: true });
    loginUser.addEventListener("animationstart", clearOnAutofill);
    loginPass.addEventListener("animationstart", clearOnAutofill);
    setTimeout(function(){
      if(!userTyped) { loginUser.value = ""; loginPass.value = ""; }
    }, 300);
  })();
  var loginBtn = document.getElementById("loginBtn");
  var loginError = document.getElementById("loginError");
  var searchInput = document.getElementById("searchInput");
  var refreshBtn = document.getElementById("refreshBtn");
  var recordsBody = document.getElementById("recordsBody");
  var recordCount = document.getElementById("recordCount");
  var emptyNote = document.getElementById("emptyNote");
  var campusBanner = document.getElementById("campusBanner");
  var campusNameText = document.getElementById("campusNameText");
  var teacherIdText = document.getElementById("teacherIdText");

  var pwModalBackdrop = document.getElementById("pwModalBackdrop");
  var pwOld = document.getElementById("pwOld");
  var pwNew = document.getElementById("pwNew");
  var pwNew2 = document.getElementById("pwNew2");
  var pwError = document.getElementById("pwError");
  var pwSuccess = document.getElementById("pwSuccess");
  var pwSaveBtn = document.getElementById("pwSaveBtn");
  var pwCancelBtn = document.getElementById("pwCancelBtn");

  var allRecords = [];
  var session = null; // { role: "owner" } or { role: "campus", teacher_id, campus_name }

  function escapeHtml(str) {
    if(!str) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function supabaseHeaders(extra) {
    var h = { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY };
    if(extra) { for(var k in extra) h[k] = extra[k]; }
    return h;
  }

  function rpcCall(name, body) {
    return fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: supabaseHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify(body)
    }).then(function(res){ return res.json(); });
  }

  function showMain() {
    loginScreen.style.display = "none";
    mainScreen.style.display = "block";
    logoutBtn.style.display = "inline-block";
    if(session.role === "campus") {
      campusBanner.style.display = "block";
      campusNameText.textContent = session.campus_name;
      teacherIdText.textContent = session.teacher_id;
      changePwHeaderBtn.style.display = "inline-block";
    } else {
      campusBanner.style.display = "none";
      changePwHeaderBtn.style.display = "none";
    }
    loadRecords();
  }

  function doLogin() {
    var user = loginUser.value.trim();
    var pass = loginPass.value;
    if(user === "admin" && pass === "admin") {
      session = { role: "owner" };
      sessionStorage.setItem("qlsw_admin_auth", JSON.stringify(session));
      loginError.style.display = "none";
      showMain();
      return;
    }
    if(!user || !pass) { loginError.style.display = "block"; return; }
    rpcCall("verify_campus_login", { p_teacher_id: user, p_password: pass })
      .then(function(list){
        if(Array.isArray(list) && list.length > 0) {
          session = { role: "campus", teacher_id: list[0].teacher_id, campus_name: list[0].campus_name, password: pass };
          sessionStorage.setItem("qlsw_admin_auth", JSON.stringify(session));
          loginError.style.display = "none";
          showMain();
        } else {
          loginError.style.display = "block";
        }
      })
      .catch(function(err){
        loginError.style.display = "block";
        console.warn(err);
      });
  }
  loginBtn.addEventListener("click", doLogin);
  loginPass.addEventListener("keydown", function(e){ if(e.key === "Enter") doLogin(); });
  loginUser.addEventListener("keydown", function(e){ if(e.key === "Enter") doLogin(); });

  var loginCard = document.getElementById("loginCard");
  var registerCard = document.getElementById("registerCard");
  var showRegisterLink = document.getElementById("showRegisterLink");
  var showLoginLink = document.getElementById("showLoginLink");
  var regName = document.getElementById("regName");
  var regTeacherId = document.getElementById("regTeacherId");
  var regPass = document.getElementById("regPass");
  var regPass2 = document.getElementById("regPass2");
  var registerBtn = document.getElementById("registerBtn");
  var registerError = document.getElementById("registerError");
  var registerSuccess = document.getElementById("registerSuccess");

  showRegisterLink.addEventListener("click", function(){
    loginCard.style.display = "none";
    registerCard.style.display = "block";
  });
  showLoginLink.addEventListener("click", function(){
    registerCard.style.display = "none";
    loginCard.style.display = "block";
  });

  registerBtn.addEventListener("click", function(){
    registerError.style.display = "none";
    registerSuccess.style.display = "none";
    var name = regName.value.trim();
    var teacherId = regTeacherId.value.trim();
    var pass = regPass.value;
    var pass2 = regPass2.value;
    if(!name || !teacherId || !pass) {
      registerError.textContent = "请填写完整";
      registerError.style.display = "block";
      return;
    }
    if(!/^\d{5}$/.test(teacherId)) {
      registerError.textContent = "工号需为5位数字";
      registerError.style.display = "block";
      return;
    }
    if(pass !== pass2) {
      registerError.textContent = "两次输入的密码不一致";
      registerError.style.display = "block";
      return;
    }
    fetch(SUPABASE_URL + "/rest/v1/" + ADMINS_TABLE, {
      method: "POST",
      headers: supabaseHeaders({ "Content-Type": "application/json", "Prefer": "return=minimal" }),
      body: JSON.stringify({ teacher_id: teacherId, password: pass, campus_name: name })
    })
      .then(function(res){
        if(res.status === 409 || res.status === 400) { throw { duplicate: true }; }
        if(!res.ok) { throw { failed: true }; }
        registerSuccess.style.display = "block";
        session = { role: "campus", teacher_id: teacherId, campus_name: name, password: pass };
        sessionStorage.setItem("qlsw_admin_auth", JSON.stringify(session));
        setTimeout(showMain, 600);
      })
      .catch(function(err){
        registerError.textContent = err && err.duplicate ? "该工号已被注册，请直接登录" : "申请失败，请检查网络后重试";
        registerError.style.display = "block";
        console.warn(err);
      });
  });

  logoutBtn.addEventListener("click", function(){
    sessionStorage.removeItem("qlsw_admin_auth");
    session = null;
    loginScreen.style.display = "flex";
    mainScreen.style.display = "none";
    logoutBtn.style.display = "none";
    changePwHeaderBtn.style.display = "none";
    loginUser.value = "";
    loginPass.value = "";
    registerCard.style.display = "none";
    loginCard.style.display = "block";
  });

  function openPwModal() {
    pwOld.value = ""; pwNew.value = ""; pwNew2.value = "";
    pwError.style.display = "none";
    pwSuccess.style.display = "none";
    pwModalBackdrop.classList.add("open");
  }
  function closePwModal() { pwModalBackdrop.classList.remove("open"); }
  changePwHeaderBtn.addEventListener("click", openPwModal);
  pwCancelBtn.addEventListener("click", closePwModal);
  pwModalBackdrop.addEventListener("click", function(e){ if(e.target === pwModalBackdrop) closePwModal(); });

  pwSaveBtn.addEventListener("click", function(){
    pwError.style.display = "none";
    pwSuccess.style.display = "none";
    var oldPw = pwOld.value;
    var newPw = pwNew.value;
    var newPw2 = pwNew2.value;
    if(!oldPw || !newPw) { pwError.textContent = "请填写完整"; pwError.style.display = "block"; return; }
    if(newPw !== newPw2) { pwError.textContent = "两次输入的新密码不一致"; pwError.style.display = "block"; return; }
    rpcCall("change_campus_password", { p_teacher_id: session.teacher_id, p_old_password: oldPw, p_new_password: newPw })
      .then(function(ok){
        if(ok === true) {
          session.password = newPw;
          sessionStorage.setItem("qlsw_admin_auth", JSON.stringify(session));
          pwSuccess.style.display = "block";
          setTimeout(closePwModal, 900);
        } else {
          pwError.textContent = "当前密码不正确";
          pwError.style.display = "block";
        }
      })
      .catch(function(err){
        pwError.textContent = "保存失败，请检查网络";
        pwError.style.display = "block";
        console.warn(err);
      });
  });

  function loadRecords() {
    var rpcName = session.role === "campus" ? "get_campus_records" : "get_all_records";
    var body = session.role === "campus"
      ? { p_teacher_id: session.teacher_id, p_password: session.password }
      : { p_admin_user: "admin", p_admin_pass: "admin" };
    recordCount.textContent = "加载中...";
    rpcCall(rpcName, body)
      .then(function(list){
        allRecords = Array.isArray(list) ? list : [];
        renderRecords(allRecords);
      })
      .catch(function(err){
        recordCount.textContent = "加载失败，请检查网络后点击刷新";
        console.warn(err);
      });
  }

  function renderRecords(records) {
    recordsBody.innerHTML = "";
    recordCount.textContent = "共 " + records.length + " 条记录";
    if(records.length === 0) {
      emptyNote.style.display = "block";
      return;
    }
    emptyNote.style.display = "none";
    records.forEach(function(rec){
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td style='font-weight:800;'>" + escapeHtml(rec.player_name) + "</td>" +
        "<td>" + escapeHtml(rec.player_school) + "</td>" +
        "<td>" + escapeHtml(rec.player_phone) + "</td>" +
        "<td>" + (rec.player_age || "-") + "</td>" +
        "<td class='score-cell' style='color:var(--blue);'>" + rec.auditory_score + "</td>" +
        "<td class='score-cell' style='color:var(--green);'>" + rec.visual_score + "</td>" +
        "<td class='score-cell' style='color:var(--brass);'>" + rec.total_score + "</td>" +
        "<td style='color:var(--slate); font-size:0.8rem;'>" + (rec.test_date || "") + "</td>";
      tr.addEventListener("click", function(){
        window.open("concentration_v1.html?record=" + encodeURIComponent(rec.record_id), "_blank");
      });
      recordsBody.appendChild(tr);
    });
  }

  searchInput.addEventListener("input", function(){
    var q = searchInput.value.trim().toLowerCase();
    if(!q) { renderRecords(allRecords); return; }
    var filtered = allRecords.filter(function(rec){
      return (rec.player_phone && rec.player_phone.toLowerCase().indexOf(q) !== -1) ||
             (rec.player_school && rec.player_school.toLowerCase().indexOf(q) !== -1);
    });
    renderRecords(filtered);
  });

  refreshBtn.addEventListener("click", loadRecords);

  var savedSession = sessionStorage.getItem("qlsw_admin_auth");
  if(savedSession) {
    try {
      session = JSON.parse(savedSession);
      showMain();
    } catch(e) {}
  }
})();
</script>

</body>
</html>
